<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Monetag Verification Code Added Below -->
    <meta name="monetag" content="5b79e796a2bd9458df33267b72f4d05c">
    
    <title>QuickLink - Premium URL Shortener</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        input[type="url"] {
            width: 90%;
            padding: 12px;
            border: 2px solid #334155;
            border-radius: 6px;
            background-color: #0f172a;
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="url"]:focus { border-color: #38bdf8; }
        button {
            width: 96%;
            padding: 12px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #0ea5e9; }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 6px;
            display: none;
            border: 1px dashed #38bdf8;
        }
        .result-box a { color: #38bdf8; font-weight: bold; text-decoration: none; word-break: break-all; }
        .ad-space {
            margin-top: 20px;
            padding: 10px;
            background: #334155;
            border-radius: 6px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔗 QuickLink</h1>
    <p>Shorten long URLs instantly and track your clicks easily.</p>
    
    <input type="url" id="longUrl" placeholder="Paste your long link here..." required>
    <button onclick="shortenLink()">Shorten URL</button>

    <div class="result-box" id="resultBox">
        <p style="margin:0 0 5px 0; color:#38bdf8;">Your Short Link:</p>
        <a href="#" id="shortLink" target="_blank"></a>
    </div>

    <div class="ad-space" id="adSpace">
        📢 Sponsored Ad Space (Monetize Here)
    </div>
</div>

<script>
    function shortenLink() {
        const longUrl = document.getElementById('longUrl').value;
        if(!longUrl) { alert('Please enter a valid link'); return; }
        
        const randomId = Math.random().toString(36).substring(2, 7);
        const shortUrl = window.location.href + "?" + randomId;
        
        document.getElementById('shortLink').innerText = shortUrl;
        document.getElementById('shortLink').href = longUrl;
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
